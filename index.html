<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series II - Webpage</title>
    <!-- Linking the external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Digital and Mono styles -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="outer-container">
        <!-- The Floating Card -->
        <div class="card">
            <div class="card-content-center">
                <h1 class="card-title">
                    <span class="word">series</span><!-- Standard pixelated text --><span class="bars">ii</span><!-- The distinct bars -->
                </h1>
                <p class="card-location">
                    <span class="pin-icon">&#128205;</span> <!-- Standard Pin Emoji -->
                    tel aviv
                </p>
            </div>
            
            <div class="card-footer">
                <div class="card-viewers">
                    <span class="red-dot"></span>
                    <span class="eye-icon">&#128065;</span> <!-- Standard Eye Emoji -->
                    <span class="viewer-count">7</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
