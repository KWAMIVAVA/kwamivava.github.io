name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A34BA3: ${{ secrets.A34BA3 }}
          B4C2B8: ${{ secrets.B4C2B8 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A34BA3', '')
          sec_b = os.environ.get('B4C2B8', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 3bb8dd82a75bf925e6c0fe5f52ab015b -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 30ea6cb54de0c927 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
